const huntFallback=(id)=>HUNT_BACKGROUNDS[id]||HUNT_BACKGROUNDS.braviary;
function pokeTargetSprite(n){
 const clean=n.toLowerCase().replace(/\([^)]*\)/g,'').replace(/\b(shiny|angry|elite|nightmare|mega)\b/g,'').replace(/[^a-z]/g,'');
 const num=POKE_NUMBERS[clean];if(!num)return '';
 const shiny=/\bshiny\b/i.test(n)?'shiny/':'';
 return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+shiny+num+'.png';
}
function monsterThumb(n){
 const src=pokeTargetSprite(n);
 const spriteLabel=src?'<span class="mob-asset-hint">Sprite da espécie</span>':'<span class="mob-asset-hint">Sem sprite validado</span>';
 const fallback=src?src.replace('https://raw.githubusercontent.com/PokeAPI/sprites/master/','https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/') : '';
 const marker=/water|sharpedo|starmie|carvanha|mantyke|empoleon|cloyster/i.test(n)?'≈':/braviary|pidgeot|honchkrow|farfetch/i.test(n)?'✦':'◇';
 return `<div class="mob-mon"><div class="mob-icon"><span class="mob-placeholder">${marker}</span>${src?`<img src="${src}" data-backup-src="${fallback}" alt="Sprite Pokémon de ${esc(n)}" loading="lazy" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.dataset.backupSrc;}else this.remove()">`:''}</div><span>${esc(n)}</span>${spriteLabel}</div>`;
}
function huntVisual(h,mode='card'){
 const asset=HUNT_FILES[h.id]||{};const image=asset.banner||asset.maps?.[0];const fallback=huntFallback(h.id);
 return `<div class="hunt-picture ${mode}"><img class="scene-bg" src="${fallback}" alt="Arte ilustrativa de ambiente, não imagem real do respawn"><img class="official-shot" data-hunt-official="true" src="${image?wikiFileUrl(image):''}" alt="Imagem de referência da Wiki PXG" loading="lazy" ${image?'':'hidden'}><div class="picture-fade"></div><span class="scene-label">${'Arte ilustrativa • mapa do jogo se disponível na Wiki'}</span><span class="scene-region">${esc(h.area)}</span></div>`;
}

function ballEligibility(ball,target,region){
 if(ball.rate===null)return {ok:false,why:'Esta bola especial não possui taxa geral comparável para essa simulação.'};
 if(ball.kind==='type'&&!ball.types.some(t=>target.types.includes(t)))return {ok:false,why:'Bola elementar incompatível com os tipos conhecidos do alvo.'};
 if(ball.kind==='nightmare'&&region!=='Nightmare World')return {ok:false,why:'Nightmare Ball só funciona na Nightmare World; não é uma bola ativada apenas à noite.'};
 if(ball.kind==='beast')return {ok:false,why:'A elegibilidade da Beast Ball depende de condições não verificadas para este Pokémon.'};
 if(ball.kind==='class')return {ok:false,why:'É necessário confirmar a classe FAST/HEAVY do alvo na Pokédex.'};
 if(ball.kind==='safari')return {ok:false,why:'Disponível somente em contextos específicos da Safari Zone.'};
 if(ball.kind==='redoma')return {ok:false,why:'Old Ball é restrita ao Redoma para Pokémon Fóssil.'};
 if(ball.kind==='friend')return {ok:false,why:'Friend Ball tem requisitos de quest e profissão Acadêmico.'};
 if(ball.kind==='fishing')return {ok:false,why:'Lure Ball depende de o Pokémon ter sido pescado pelo jogador.'};
 if(ball.kind==='repeat')return {ok:false,why:'Repeat Ball exige a habilidade específica da constelação do Celebi.'};
 return {ok:true,why:ball.kind==='premier'?'Premier Ball não conta para o Catch System progressivo.':'Rate comparativo documentado pela wiki do PXG.'};
}

function v7Ritmo(t){const eligible=Number(v7KillRate),goal=Number(v7KillGoal),increase=Math.round((goal/eligible-1)*100),q=v7SpawnScenario==='none'?null:1/Number(v7SpawnScenario);const m=Math.ceil(q?Math.log(.5)/Math.log(1-q):0);const fmtHour=mins=>mins>=60?(mins/60).toLocaleString('pt-BR',{maximumFractionDigits:1})+' h':Math.round(mins)+' min';
 return `${['elite','mega','angry','tr'].includes(t.form)?'<div class="v7-info warning"><strong>Variantes especiais:</strong> abates/h não permitem prever aparições de boss, Elite, Angry ou TR. Abaixo você compara somente o ritmo de alvos derrotados. Para frequência de eventos especiais, consulte as regras específicas do local.</div>':''}${v8RotationPlanner()}<div class="v7-grid"><section class="v7-card"><h3>Quantos Pokémon derrotar por hora?</h3><p>Use o ritmo de <b>alvos elegíveis</b> da hunt. Não conte todos os monstros se você está tentando encontrar uma espécie específica.</p><div class="v7-field"><label>Ritmo de referência (cenário)</label><div class="v7-presets">${[200,400,600,800].map(x=>`<button type="button" data-v7-kills="${x}" class="${eligible===x?'on':''}">${x}/h</button>`).join('')}</div></div><div class="v7-field" style="margin-top:14px"><label>Meta de abates/h</label><div class="v7-presets">${[300,500,700,900].map(x=>`<button type="button" data-v7-goal="${x}" class="${goal===x?'on':''}">${x}/h</button>`).join('')}</div></div></section><section class="v7-card"><h3>Ganhos ao melhorar a rota</h3><div class="v7-stats" style="grid-template-columns:1fr 1fr"><div class="v7-stat"><small>Abates/h atuais (hipótese)</small><strong>${asNum(eligible)}</strong><span>Pokémon-alvo/h</span></div><div class="v7-stat"><small>Meta de abates/h</small><strong>${asNum(goal)}</strong><span>${increase>=0?'+':''}${increase}% de oportunidades</span></div></div><div class="v7-metricrow"><span>Referência</span><div class="v7-metricbar"><i style="width:${Math.min(100,eligible/900*100)}%"></i></div><strong>${eligible}/h</strong></div><div class="v7-metricrow"><span>Meta</span><div class="v7-metricbar"><i style="width:${Math.min(100,goal/900*100)}%"></i></div><strong>${goal}/h</strong></div><div class="v7-info">Mais abates podem gerar mais oportunidades, mas o aumento real de aparições depende da mecânica da hunt, da elegibilidade do Pokémon e dos buffs.</div></section></div>
 <section class="v7-card"><div class="v7-main-line"><h3>Quanto tempo para derrotar X alvos?</h3><span class="v7-pill green">Estimativa baseada em ritmo</span></div><div class="v7-steps-3">${[100,500,1000].map(x=>`<div><small>${asNum(x)} Pokémon-alvo</small><b>${fmtHour(x/eligible*60)}</b><small>Com ${eligible} abates/h</small><br><small>Na meta: ${fmtHour(x/goal*60)}</small></div>`).join('')}</div></section>
 <section class="v7-card"><h3>Simular aparição de Shiny (opcional)</h3><p>A chance individual de surgimento não é pública. Para demonstrar a diferença entre matar 200 e 800 por hora, escolha uma <b>hipótese matemática</b>. Nenhuma dessas taxas é uma previsão do PXG.</p><div class="v7-presets">${[['none','Sem assumir chance'],['200','Hipótese 1 em 200'],['500','Hipótese 1 em 500'],['1000','Hipótese 1 em 1.000']].map(([v,n])=>`<button type="button" data-v7-spawn="${v}" class="${v7SpawnScenario===v?'on':''}">${n}</button>`).join('')}</div>${q?`<div class="v7-stats" style="margin-top:12px"><div class="v7-stat"><small>Abates médios hipotéticos</small><strong>${asNum(1/q)}</strong><span>Modelo geométrico ilustrativo</span></div><div class="v7-stat"><small>Tempo médio no ritmo atual*</small><strong>${fmtHour((1/q)/eligible*60)}</strong><span>Se a chance fosse 1/${asNum(1/q)}</span></div><div class="v7-stat"><small>Tempo médio na meta*</small><strong>${fmtHour((1/q)/goal*60)}</strong><span>Hipótese independente</span></div></div><p style="margin-bottom:0;font-size:12px">*Não é tempo esperado real no PokeXGames; bosses, Angry, Elite e aparições especiais podem seguir outras regras.</p>`:`<div class="v7-info" style="margin-top:12px">Sem assumir uma taxa de aparição, mostramos apenas o que é verificável: abates por hora, potencial de rota e limites de respawn.</div>`}</section>
 <section class="v7-card"><h3>Como aumentar abates/h com Raibolt</h3><div class="v7-checklist">${[
 'Faça uma rota circular e minimize deslocamento sem Pokémon vivos. Compare o trajeto com os mapas da Wiki.',
 'Ajuste o tamanho do lure à resistência dos Pokémon e ao dano em área do seu time; evite mortes e tempo parado.',
 'Priorize o respawn que permite encontrar mais alvos elegíveis, não apenas maior quantidade de monstros totais.',
 'O tempo padrão de respawn é de 1 a 3 minutos em muitas hunts; alguns Pokémon e bosses têm tempos próprios.',
 'Use o Hunt Analyzer do jogo para observar o ritmo real e comparar sessões; não é preciso criar cadastro no site.'
 ].map(x=>`<div><span class="check">✓</span><span>${x}</span></div>`).join('')}</div><p style="margin:14px 0 0"><a class="v7-link" href="https://wiki.pokexgames.com/index.php/Tempo_de_Respawn" target="_blank" rel="noopener noreferrer">Tempos de respawn oficiais ↗</a> · <a class="v7-link" href="https://wiki.pokexgames.com/index.php/Sistema_de_Estat%C3%ADstica" target="_blank" rel="noopener noreferrer">Estatísticas do jogo ↗</a></p></section>`;
}
function catchGuide(){const t=v7Current();return head('PXG HUB · HUNT INTELLIGENCE','Catch & Shiny','Escolha qualquer forma documentada, compare Pokébolas e planeje um ritmo maior de abates para buscar Shinies.')+`<section class="v7"><div class="v7-intro"><div><div class="eyebrow">⚡ CENTRAL DE CAÇA • ELDERTHEUS</div><h2>Capture com a bola certa.</h2><p>Escolha a <b>Pokébola que vai usar</b>, o Pokémon e a variante para ver <b>quantidade média teórica</b> ou abra a rotação para matar mais por hora.</p></div><div class="em">⚡</div></div>${v7Selector(t)}<div class="v7-tabs"><button type="button" data-v7-mode="capture" class="${v7Mode==='capture'?'on':''}" aria-pressed="${v7Mode==='capture'}">◎ Capturar Pokémon<small>Escolher bola e ver médias condicionais</small></button><button type="button" data-v7-mode="ritmo" class="${v7Mode==='ritmo'?'on':''}" aria-pressed="${v7Mode==='ritmo'}">✧ Caçar Shinies<small>Abates/h, metas e respawn</small></button></div>${v7Mode==='capture'?v7Capture(t):v7Ritmo(t)}<div class="v7-info" style="margin-bottom:20px"><strong>Fontes e limites:</strong> a presença de uma forma na Pokédex não garante captura em todo encontro. Somente Elite Farfetch'D tem confirmação explícita nesta seleção. Odds reais e médias de Shiny/Elite exigem amostras específicas; as hipóteses são identificadas. <a class="v7-link" href="https://wiki.pokexgames.com/index.php/Pok%C3%A9mon" target="_blank" rel="noopener noreferrer">Pokédex PXG ↗</a></div></section>`}

const pages={home,team,hunts,catch:catchGuide,runes,stars,gauntlet,updates};
function render(){let hash=location.hash.replace('#','');page=pages[hash]?hash:'home';$('#side-nav').innerHTML=nav.map(([id,ic,n])=>`<button class="nav-btn ${id===page?'active':''}" data-page="${id}"><span class="nav-ico">${ic}</span>${n}</button>`).join('');$('#bottom-nav').innerHTML=shortNav.map(([id,ic,n])=>`<button class="bottom-btn ${id===page?'active':''}" data-page="${id}"><span class="nav-ico">${ic}</span>${n}</button>`).join('');$('#page').innerHTML=pages[page]();hydrateSprites();checkOfficialImages();}
function checkOfficialImages(){document.querySelectorAll('img[data-hunt-official]').forEach(el=>{el.onload=()=>{if(el.naturalWidth>20){el.closest('.hunt-picture')?.classList.add('official-visible');const label=el.parentElement.querySelector('.scene-label');if(label)label.textContent='Imagem oficial • Wiki PokeXGames';}};el.onerror=()=>{const parent=el.parentElement;el.remove();const label=parent?.querySelector('.scene-label');if(label)label.textContent='Arte ilustrativa • consultar mapa na Wiki';};})}
function hydrateSprites(){document.querySelectorAll('img.pokemon-img[data-official]').forEach(el=>{if(!el.dataset.official)return;const ref=new Image();ref.onload=()=>{if(el.isConnected&&ref.naturalWidth>16)el.src=ref.src};ref.onerror=()=>{};ref.src=el.dataset.official})}
function openModal(markup){$('#modal').innerHTML=`<div class="modal-shade" data-shade><section role="dialog" aria-modal="true" class="modal-box">${markup}</section></div>`;document.body.style.overflow='hidden'}
function closeModal(){$('#modal').innerHTML='';document.body.style.overflow=''}
function pokemonModal(id){const p=POKEMON.find(x=>x.id===id);if(!p)return;openModal(`<div class="modal-head"><div><div class="eyebrow">${esc(p.tier)} · ${esc(p.kind)}</div><h2>${esc(p.name)}</h2></div><button class="modal-x" data-close>×</button></div><div class="modal-body">${img(p.id,p.name)}<div><div class="row">${tag(`ATTACK T${p.atk}`,'gold')}${tag(p.types.join(' / '))}</div><p>${esc(p.detail)}</p><p><b>Função:</b> ${esc(p.role)}<br><b>Held equipado:</b> Attack T${p.atk}</p>${link(p.src,'Ficha PXG ↗')}</div></div><h3 style="margin:17px 0 7px">Movimentos documentados</h3><div class="moves">${p.moves.map((m,i)=>`<span><b style="color:var(--gold)">M${i+1}</b> ${esc(m)}</span>`).join('')}</div>`);hydrateSprites()}
function huntModal(id){const h=HUNTS.find(x=>x.id===id);if(!h)return;
 const m=HUNT_FILES[h.id]||{maps:[]};const shots=(m.maps||[]).slice(0,3);const catchTarget=BALL_TARGETS.find(t=>h.pokemon.some(n=>n.toLowerCase().includes(t.name.toLowerCase())))?.name||'Braviary';
 openModal(`<div class="hunt-detail"><div class="modal-head"><div><div class="eyebrow">${esc(h.region)} · ${esc(h.area)}</div><h2>${esc(h.title)}</h2><div class="row wrap">${h.targetTypes.map(t=>tag(t,'gold')).join('')}${tag(groups[h.category])}</div></div><button class="modal-x" data-close aria-label="Fechar">×</button></div>
 ${huntVisual(h,'large')}
 <div class="hunt-detail-grid"><div class="hunt-content"><div class="section-label">◈ Pokémons encontrados neste respawn</div><div class="encounter-grid">${h.pokemon.map(monsterThumb).join('')}</div><div class="section-label" style="margin-top:16px">⌖ Localização e galeria oficial</div><div class="location-gallery">${shots.length?shots.map((f,i)=>`<a class="gallery-entry" href="${wikiFilePage(f)}" target="_blank" rel="noopener noreferrer"><div class="gallery-visual"><img src="${wikiFileUrl(f)}" alt="Mapa oficial ${esc(f)}" loading="lazy" onerror="this.remove()"><img class="gallery-fallback" src="${huntFallback(h.id)}" alt="Arte ilustrativa de reserva"></div><b>${i===0?'Acesso':i===1?'Rota alternativa':'Respawn'}</b><small>Ver screenshot na Wiki ↗</small></a>`).join(''):`<div class="text-note">Não há prints específicos verificados nesta ficha. ${link(h.src,'Ver a localização na wiki ↗')}</div>`}</div><p class="tiny-disclaimer">As imagens oficiais são buscadas na wiki. Caso não carreguem, aparece apenas uma arte ilustrativa identificada; não confunda com o mapa real.</p></div>
 <aside class="hunt-facts"><h3>⚡ Análise para Eldertheus</h3><div class="fact-stat"><small>Clã recomendado</small><b>${h.clans.includes('Raibolt')?'Raibolt indicado pela Wiki':'Verificar indicação'}</b></div><div class="fact-stat"><small>XP no level 598</small><b>${esc(h.xpNote)}</b></div><div class="fact-stat"><small>Objetivos da hunt</small><div class="row wrap">${h.goal.map(g=>tag(g)).join('')}</div></div><div class="fact-stat"><small>Quests / rota</small><p>${esc(h.quest||'Consultar Wiki')}</p></div><div class="fact-stat"><small>Recomendação</small><p>${esc(h.recommendation)}</p></div><div class="fact-stat"><small>Chance de Catch / Shiny</small><b>Não divulgada</b><p>Não é possível fornecer chance numérica específica com confiança a partir dos dados publicados. Abra a calculadora para comparar quantidades e tipos de Pokébola por hipótese.</p><button class="cta secondary" data-hunt-catch="${esc(catchTarget)}">◎ Calcular Pokébolas para ${esc(catchTarget)} →</button></div>${link(h.src,'Página oficial desta hunt ↗')}</aside></div></div>`);
}
function navigate(p){if(p==='more'){const sb=$('#sidebar'),sh=$('#shade');sb.classList.add('open');sh.hidden=false;sh.classList.add('show');return}location.hash=p;render();window.scrollTo({top:0,behavior:'instant'});$('#sidebar').classList.remove('open');$('#shade').classList.remove('show');$('#shade').hidden=true}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-page],[data-pokemon],[data-hunt],[data-tab],[data-slot],[data-close],[data-shade],[data-preset],[data-ball-choose],[data-hunt-catch],[data-ball-target],[data-ball-variant],[data-ball-show-search]');if(!t)return;if(t.dataset.page){navigate(t.dataset.page);return}if(t.dataset.pokemon){pokemonModal(t.dataset.pokemon);return}if(t.dataset.hunt){huntModal(t.dataset.hunt);return}if(t.dataset.tab){catchTab=t.dataset.tab;render();return}if(t.dataset.slot){simSlot=t.dataset.slot;render();return}if(t.dataset.preset){rarePreset=t.dataset.preset;render();return}if(t.dataset.ballChoose){ballSelected=t.dataset.ballChoose;catchTab='balls';render();return}if(t.dataset.ballTarget){ballTarget=t.dataset.ballTarget;catchTab='balls';render();return}if(t.dataset.ballVariant){ballVariant=t.dataset.ballVariant;const items=matchingTargets('');if(!BALL_TARGETS.some(x=>x.name===ballTarget&&(ballVariant==='normal'||x.shiny)))ballTarget=items[0]?.name||'Starmie';catchTab='balls';render();return}if(t.hasAttribute('data-ball-show-search')){const list=$('#poke-results');if(list){list.hidden=!list.hidden;list.innerHTML=pokemonResults('');$('#poke-search')?.focus();}return}if(t.dataset.huntCatch){ballTarget=t.dataset.huntCatch;ballVariant='normal';ballRegion='Nightmare World';ballSelected='ultra';v7Form='normal';v7Selected='normal:'+ballTarget;v7Search='';v7Mode='capture';catchTab='balls';closeModal();navigate('catch');return}if(t.hasAttribute('data-close'))closeModal();if(t.hasAttribute('data-shade')&&t===ev.target)closeModal()});
document.addEventListener('focusin',ev=>{if(ev.target.id==='poke-search'){ev.target.select();const list=$('#poke-results');if(list){list.hidden=false;list.innerHTML=pokemonResults('')}}});document.addEventListener('input',ev=>{if(ev.target.id==='poke-search'){const list=$('#poke-results');if(list){list.hidden=false;list.innerHTML=pokemonResults(ev.target.value)}return}if(ev.target.id==='hunt-search'){huntSearch=ev.target.value;const caret=ev.target.selectionStart;render();const field=$('#hunt-search');field?.focus();field?.setSelectionRange(caret,caret)}});
document.addEventListener('change',ev=>{if(ev.target.dataset.ball){const k=ev.target.dataset.ball;if(k==='selected')ballSelected=ev.target.value;else if(k==='target')ballTarget=ev.target.value;else if(k==='region')ballRegion=ev.target.value;else if(k==='count')ballCount=Number(ev.target.value);else if(k==='ultraChance')ballUltraChance=ev.target.value;catchTab='balls';render();return}if(ev.target.dataset.rare){if(ev.target.dataset.rare==='preset')rarePreset=ev.target.value;else rareRegion=ev.target.value;render();return}if(ev.target.dataset.spend){captureSpend=ev.target.value;render();return}if(ev.target.dataset.filter){if(ev.target.dataset.filter==='type')huntType=ev.target.value;else if(ev.target.dataset.filter==='goal')huntGoal=ev.target.value;else huntCategory=ev.target.value;render()}});
