*{box-sizing:border-box}body{margin:0;background:#0a0917;color:#f7f1ff;font:15px/1.65 system-ui,-apple-system,sans-serif}main{max-width:950px;margin:auto;padding:20px 16px 80px}a{color:#ffe083}header{padding:8px 0 20px}.back{display:inline-block;text-decoration:none;font-weight:750;color:#dcc9f6;padding:10px 0}.eyebrow{color:#f9d65e;font-size:11px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}.hero{border:1px solid #8453af;border-radius:18px;background:radial-gradient(circle at 85% 0%,#512878,#211334 52%,#151026);padding:24px;margin:12px 0 24px}.hero h1{font-size:clamp(27px,5vw,42px);line-height:1.14;margin:10px 0}.muted{color:#c4b5d7}.pill{display:inline-block;border:1px solid #8b682c;background:#3b2b1b;color:#ffe08a;padding:4px 10px;border-radius:30px;font-size:12px;font-weight:800}.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-top:18px}.stat{background:#120e21a8;border:1px solid #664483;border-radius:11px;padding:12px}.stat strong{display:block;font-size:17px}.stat small{color:#c5b6d6}.section-title{margin:30px 0 14px;font-size:23px}.story{display:grid;grid-template-columns:165px minmax(0,1fr);gap:18px;align-items:start;background:linear-gradient(130deg,#211735,#141021);border:1px solid #614183;border-radius:16px;padding:18px;margin:14px 0}.art{min-height:165px;border-radius:12px;background:radial-gradient(circle,#49316e,#19132d 70%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px;text-align:center}.art img{width:125px;height:125px;object-fit:contain;image-rendering:pixelated}.art small{font-size:10px;color:#d2c0e5}.story h2{margin:5px 0 9px;font-size:22px;line-height:1.25}.story p{margin:9px 0;color:#e1d5ec}.change{border-left:3px solid #e8bf4b;padding:8px 12px;background:#302440;border-radius:0 8px 8px 0}.impact{border:1px solid #4d6e64;background:#142922;border-radius:10px;padding:12px;margin-top:13px;font-size:13px}.impact strong{color:#a5f4d6}.panel{background:#1a142d;border:1px solid #624282;border-radius:15px;padding:18px;margin:18px 0}.panel h2{margin-top:0}.original{white-space:pre-line;overflow-wrap:anywhere;color:#dfd2e8}.btn{display:inline-block;background:#513274;color:white;text-decoration:none;border:1px solid #9064b5;padding:10px 15px;border-radius:9px;font-weight:800}.fine{font-size:12px;color:#b5a5ca}@media(max-width:540px){.story{grid-template-columns:1fr;padding:14px;gap:10px}.art{min-height:120px;flex-direction:row;gap:16px;justify-content:flex-start;text-align:left}.art img{height:95px;width:95px}.story h2{font-size:20px}.hero{padding:19px}.section-title{font-size:21px}}</style></head><body><main><header><a class="back" href="./index.html#updates">← Todas as atualizações</a></header><div id="root"><div class="panel">Carregando notícia...</div></div><script>

const curated={
'pxg-09-11-2026':[
{title:'Giant Galvantula Master',pokemon:'Vikavolt',num:738,kind:'Dimensional Zone · Mudança importante',change:'Shiny Electabuzz e Shiny Raichu saem da composição; Shiny Vikavolt e Vikavolt entram. A velocidade dos Vikavolt também foi revisada.',impact:'A recomendação divulgada para a zona é utilizar Pokémon de Pedra ou Fogo. Não considerar o time elétrico do Eldertheus automaticamente ideal para essa luta.'},
{title:'Heatran Master',pokemon:'Heatran',num:485,kind:'Dimensional Zone · Novos inimigos',change:'Camerupt e Mega Blaziken são substituídos por Shiny Typhlosion e Shiny Arcanine.',impact:'Reavaliar os perigos da composição e as resistências dos Pokémon antes de recomendar uma equipe.'},
{title:'Shiny Sylveon Master',pokemon:'Togekiss',num:468,kind:'Dimensional Zone · Mudança de composição',change:'Shiny Mr. Mime e Granbull saem e Shiny Togekiss entra.',impact:'Atualizar a lista de inimigos e revisar a estratégia contra o novo encontro.'},
{title:'Giant Galvantula · Revives',pokemon:'Galvantula',num:596,kind:'Mecânica de dungeon',change:'O limite de Max Revives passa de 10 para 11 nas zonas informadas.',impact:'Atualizar o planejamento de consumíveis, sem presumir que a dificuldade total da zona diminuiu.'},
{title:'Magmortar e Vikavolt selvagens',pokemon:'Magmortar',num:467,kind:'Hunts · Comportamento',change:'Magmortar usa Magma Storm com menor frequência; Vikavolt e Shiny Vikavolt selvagens deixam de usar Vise Grip.',impact:'Revisar alertas de perigo dos respawns envolvidos. Não inventar mudanças de XP/h ou loot.'},
{title:'Discípulos do Lance',pokemon:null,kind:'Quests e mapas',change:'Novo caminho, mapa reformulado e NPCs enfraquecidos.',impact:'Revisar o percurso antes de recomendar uma rota atualizada.'},
{title:'Profissões e Daily Kill',pokemon:'Toxicroak',num:454,kind:'Profissões e tarefas',change:'Tempos de coleta padronizados com atraso progressivo; a Daily Kill de Toxicroak exige mais abates.',impact:'Reavaliar rotinas de coleta e conferir a nova quantidade exigida na fonte antes de informar números.'}

function story(s){return '<article class="story"><div class="art">'+(s.num?'<img src="'+(s.imageUrl||sprite(s.num))+'" alt="Imagem de '+esc(s.pokemon)+'" loading="lazy"><small>'+esc(s.pokemon)+'</small>':'<div style="font-size:46px">⚡</div><small>'+esc(s.kind)+'</small>')+'</div><div><div class="eyebrow">'+esc(s.kind)+'</div><h2>'+esc(s.title)+'</h2><div class="change"><strong>O que mudou</strong><p>'+esc(s.change)+'</p></div><div class="impact"><strong>⚡ Impacto para Eldertheus</strong><div>'+esc(s.impact)+'</div></div></div></article>'}
(async()=>{try{const r=await fetch('./data/pxg-news.json',{cache:'no-store'});if(!r.ok)throw Error('Feed indisponível');const d=await r.json();const id=new URLSearchParams(location.search).get('id');const n=d.notes.find(x=>x.id===id);if(!n)throw Error('Essa notícia não está mais disponível no histórico atual');const sections=curated[id]||(Array.isArray(n.sections)&&n.sections.length?n.sections:String(n.body||'').split(/\n+/).map(t=>t.trim()).filter(Boolean).map((t,i)=>({title:'Alteração '+(i+1),kind:'Atualização PXG',change:t,impact:'Verifique a aplicabilidade ao Raibolt antes de alterar builds ou recomendações.'})));document.title=n.title+' | PXG Hub';document.getElementById('root').innerHTML='<section class="hero"><div class="eyebrow">PXG HUB · ELDERTHEUS EDITION</div><h1>'+esc(n.title)+'</h1><div class="pill">📅 '+esc(n.date)+'</div><p class="muted">As mudanças organizadas por assunto, com artes e impacto para seu Raibolt nível 598.</p><div class="overview"><div class="stat"><strong>'+sections.length+'</strong><small>Assuntos desta notícia</small></div><div class="stat"><strong>Raibolt</strong><small>Análise personalizada</small></div><div class="stat"><strong>Fonte</strong><small>Comunicado público</small></div></div></section><h2 class="section-title">O que mudou nesta atualização</h2>'+sections.map(story).join('')+'<p class="fine">Imagens da Wiki PXG quando verificadas; caso contrário, sprites ilustrativos. Mapas só aparecem quando há imagem confirmada. As análises de impacto são editoriais e não fazem parte do comunicado oficial.</p><a class="back" href="./index.html#updates">← Voltar ao histórico de atualizações</a>';}catch(e){document.getElementById('root').innerHTML='<div class="panel">'+esc(e.message)+'</div>';}})();
</script></main></body></html>
