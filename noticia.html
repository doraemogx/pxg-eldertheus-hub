<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#130d27"><title>Notícia PXG | Eldertheus Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0919;color:#f8f1ff;font:15px/1.7 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px 18px 70px}a{color:#f8d45e}header{padding:16px 0 24px;border-bottom:1px solid #513776}.back{display:inline-block;padding:9px 0;text-decoration:none;font-weight:700}h1{font-size:clamp(27px,5vw,43px);line-height:1.2;margin:10px 0}h2{font-size:21px;margin-top:30px}.eyebrow{color:#f8d45e;font-size:12px;letter-spacing:1px;font-weight:900}.panel{background:#19132c;border:1px solid #69478e;border-radius:15px;padding:18px;margin:20px 0}.muted{color:#c1b3d1}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.mon{border:1px solid #5a3e7d;border-radius:12px;padding:12px;text-align:center;background:#231936}.mon img{width:110px;height:110px;max-width:100%;object-fit:contain;image-rendering:pixelated}.mon b{display:block;font-size:13px}.body{white-space:pre-line;overflow-wrap:anywhere}.note{border-left:3px solid #e8c14e;padding:10px 15px;background:#2a203c}.btn{display:inline-block;border-radius:10px;background:#55347d;border:1px solid #9569c1;color:#fff;text-decoration:none;font-weight:800;padding:10px 15px}.loader{padding:30px;text-align:center}</style></head><body><main><header><a class="back" href="./index.html#updates">← Voltar às atualizações</a><div class="eyebrow">PXG HUB · ELDERTHEUS · RAIBOLT</div><h1 id="title">Atualização PXG</h1><div class="muted" id="date">Carregando comunicado...</div></header><div id="content" class="loader">Carregando notícia completa...</div></main><script>
const pokemon=[['Vikavolt',738],['Galvantula',596],['Heatran',485],['Togekiss',468],['Magmortar',467],['Toxicroak',454],['Lucario',448],['Riolu',447],['Raichu',26],['Electabuzz',125],['Arcanine',59],['Typhlosion',157],['Sylveon',700],['Blaziken',257],['Camerupt',323],['Mr. Mime',122],['Granbull',210]];
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const r=await fetch('./data/pxg-news.json',{cache:'no-store'});if(!r.ok)throw Error('Falha ao consultar arquivo de notícias');const data=await r.json();const id=new URLSearchParams(location.search).get('id');const n=data.notes.find(x=>x.id===id);if(!n)throw Error('Notícia não encontrada no histórico atual');document.title=n.title+' | PXG Hub';document.getElementById('title').textContent=n.title;document.getElementById('date').textContent='📅 '+n.date+' · '+(n.sourceType||'Comunicado público');const mons=pokemon.filter(([name])=>String(n.body).toLowerCase().includes(name.toLowerCase()));document.getElementById('content').className='';document.getElementById('content').innerHTML='<section class="panel"><h2>Resumo</h2><p>'+escapeHTML(String(n.body).replace(/\s+/g,' ').slice(0,230))+'…</p></section>'+(mons.length?'<section><h2>Pokémon mencionados</h2><div class="gallery">'+mons.map(([name,num])=>'<div class="mon"><img loading="lazy" alt="Arte ilustrativa de '+escapeHTML(name)+'" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+num+'.png"><b>'+escapeHTML(name)+'</b></div>').join('')+'</div><p class="muted" style="font-size:12px">Artes ilustrativas da PokéAPI, não necessariamente sprites ou formas do PXG.</p></section>':'')+'<section class="panel"><h2>Comunicado completo</h2><p class="body">'+escapeHTML(n.body)+'</p></section><section class="note"><b>Análise para Eldertheus · nível 598</b><p>As alterações acima devem ser consideradas nas hunts, quests ou dungeons correspondentes. A recomendação de equipe depende de resistência, perigo e retorno real de XP/loot; nenhuma taxa não publicada é presumida.</p></section><p><a class="btn" target="_blank" rel="noopener noreferrer" href="'+escapeHTML(n.source||'https://pxgtools.com.br/news')+'">Consultar fonte original ↗</a></p>';}catch(e){document.getElementById('content').textContent=e.message;}})();
</script></body></html>
