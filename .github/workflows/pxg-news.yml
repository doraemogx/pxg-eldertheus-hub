name: Atualizar boletins PXG
on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pxg-news-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar comunicados públicos
        run: python scripts/sync_pxg_news.py
      - name: Publicar somente se houver mudança
        run: |
          if ! git diff --quiet -- data/pxg-news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pxg-news.json
            git commit -m "chore: sincronizar comunicados PXG"
            git push
          fi
